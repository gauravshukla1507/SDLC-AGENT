name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  orchestrator:
    name: Orchestrator (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4          # node demo verification uses npm
        with:
          node-version: "20"
      - uses: actions/setup-java@v4          # PMD for the Apex stack demo
        with:
          distribution: temurin
          java-version: "21"
      - name: Install PMD
        run: |
          curl -sSL -o pmd.zip https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.8.0/pmd-dist-7.8.0-bin.zip
          unzip -q pmd.zip -d "$RUNNER_TEMP"
          echo "PMD_BIN=$RUNNER_TEMP/pmd-bin-7.8.0/bin/pmd" >> "$GITHUB_ENV"
      - run: pip install -r orchestrator/requirements.txt
      - run: python -m pytest -q
        working-directory: orchestrator

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    needs: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r orchestrator/requirements.txt
      - run: npm ci
        working-directory: vscode-extension
      - run: npm test
        working-directory: vscode-extension
        env:
          PYTHON: python
      - run: npx vsce package --allow-missing-repository
        working-directory: vscode-extension
      - uses: actions/upload-artifact@v4
        with:
          name: agentic-sdlc-vsix
          path: vscode-extension/*.vsix
